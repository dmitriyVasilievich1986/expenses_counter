name: Auto Version Bump

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
      - master
      - development

permissions:
  contents: write
  pull-requests: read

jobs:
  version-bump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for existing version bump commit
        id: check_commit
        run: |
          # Get the base branch for comparison
          BASE_BRANCH="${{ github.base_ref }}"

          # Check if any commit in the PR contains "[version bump]"
          if git log origin/$BASE_BRANCH..HEAD --pretty=%B | grep -q "\[version bump\]"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Found existing version bump commit in PR, skipping..."

            # Show which commit(s) contain the marker
            echo "Version bump commits found:"
            git log origin/$BASE_BRANCH..HEAD --pretty=format:"%h - %s" --grep="\[version bump\]"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "No version bump commit found in PR, proceeding..."
          fi

      - name: Check for backend changes
        if: steps.check_commit.outputs.skip == 'false'
        id: backend_changes
        run: |
          # Get the base branch for comparison
          BASE_BRANCH="${{ github.base_ref }}"

          # Check if there are changes in backend/ folder
          if git diff --name-only origin/$BASE_BRANCH...HEAD | grep -q "^backend/"; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Backend changes detected"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No backend changes detected"
          fi

      - name: Check for frontend changes
        if: steps.check_commit.outputs.skip == 'false'
        id: frontend_changes
        run: |
          # Get the base branch for comparison
          BASE_BRANCH="${{ github.base_ref }}"

          # Check if there are changes in frontend/ folder
          if git diff --name-only origin/$BASE_BRANCH...HEAD | grep -q "^frontend/"; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Frontend changes detected"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No frontend changes detected"
          fi

      - name: Setup Python
        if: steps.check_commit.outputs.skip == 'false' && (steps.backend_changes.outputs.changed == 'true' || steps.frontend_changes.outputs.changed == 'true')
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Determine branch strategy
        if: steps.check_commit.outputs.skip == 'false' && (steps.backend_changes.outputs.changed == 'true' || steps.frontend_changes.outputs.changed == 'true')
        id: branch_strategy
        run: |
          BASE_BRANCH="${{ github.base_ref }}"
          if [ "$BASE_BRANCH" = "master" ] || [ "$BASE_BRANCH" = "main" ]; then
            echo "branch=master" >> $GITHUB_OUTPUT
            echo "Targeting master/main branch - will bump MINOR version"
          else
            echo "branch=development" >> $GITHUB_OUTPUT
            echo "Targeting development branch - will bump PATCH version"
          fi

      - name: Bump backend version
        if: steps.check_commit.outputs.skip == 'false' && steps.backend_changes.outputs.changed == 'true'
        run: |
          echo "Bumping backend version..."
          python .github/scripts/bump_version.py \
            --file backend/src/expenses_counter/__init__.py \
            --type backend \
            --branch ${{ steps.branch_strategy.outputs.branch }}

          # Display the new version
          NEW_VERSION=$(python .github/scripts/bump_version.py \
            --file backend/src/expenses_counter/__init__.py \
            --type backend \
            --get-version)
          echo "Backend version bumped to: $NEW_VERSION"

      - name: Bump frontend version
        if: steps.check_commit.outputs.skip == 'false' && steps.frontend_changes.outputs.changed == 'true'
        run: |
          echo "Bumping frontend version..."
          python .github/scripts/bump_version.py \
            --file frontend/package.json \
            --type frontend \
            --branch ${{ steps.branch_strategy.outputs.branch }}

          # Display the new version
          NEW_VERSION=$(python .github/scripts/bump_version.py \
            --file frontend/package.json \
            --type frontend \
            --get-version)
          echo "Frontend version bumped to: $NEW_VERSION"

      - name: Commit version changes
        if: steps.check_commit.outputs.skip == 'false' && (steps.backend_changes.outputs.changed == 'true' || steps.frontend_changes.outputs.changed == 'true')
        run: |
          # Check if there are any changes to commit
          if git diff --quiet; then
            echo "No version changes to commit"
            exit 0
          fi

          # Determine what was bumped
          BACKEND_CHANGED="${{ steps.backend_changes.outputs.changed }}"
          FRONTEND_CHANGED="${{ steps.frontend_changes.outputs.changed }}"

          if [ "$BACKEND_CHANGED" = "true" ] && [ "$FRONTEND_CHANGED" = "true" ]; then
            COMMIT_MSG="chore: bump backend and frontend versions [version bump]"
          elif [ "$BACKEND_CHANGED" = "true" ]; then
            BACKEND_VERSION=$(python .github/scripts/bump_version.py \
              --file backend/src/expenses_counter/__init__.py \
              --type backend \
              --get-version)
            COMMIT_MSG="chore: bump backend version to $BACKEND_VERSION [version bump]"
          else
            FRONTEND_VERSION=$(python .github/scripts/bump_version.py \
              --file frontend/package.json \
              --type frontend \
              --get-version)
            COMMIT_MSG="chore: bump frontend version to $FRONTEND_VERSION [version bump]"
          fi

          git add backend/src/expenses_counter/__init__.py frontend/package.json
          git commit -m "$COMMIT_MSG"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Summary
        if: steps.check_commit.outputs.skip == 'false'
        run: |
          echo "### Version Bump Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.backend_changes.outputs.changed }}" = "true" ]; then
            BACKEND_VERSION=$(python .github/scripts/bump_version.py \
              --file backend/src/expenses_counter/__init__.py \
              --type backend \
              --get-version)
            echo "✅ Backend version: **$BACKEND_VERSION**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ Backend: No changes detected" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.frontend_changes.outputs.changed }}" = "true" ]; then
            FRONTEND_VERSION=$(python .github/scripts/bump_version.py \
              --file frontend/package.json \
              --type frontend \
              --get-version)
            echo "✅ Frontend version: **$FRONTEND_VERSION**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ Frontend: No changes detected" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Branch strategy: **${{ steps.branch_strategy.outputs.branch }}**" >> $GITHUB_STEP_SUMMARY
