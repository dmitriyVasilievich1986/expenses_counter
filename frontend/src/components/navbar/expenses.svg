<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Expenses Counter icon</title>
  <desc>A minimal donut chart with three colored segments and a dollar sign in the center</desc>

  <circle cx="150" cy="150" r="100" fill="none" stroke="#E8E8E8" stroke-width="50"/>

  <circle cx="150" cy="150" r="100" fill="none"
    stroke="#4A90D9"
    stroke-width="50"
    stroke-dasharray="274 354"
    stroke-dashoffset="157"
    stroke-linecap="butt"/>

  <circle cx="150" cy="150" r="100" fill="none"
    stroke="#3DBE7A"
    stroke-width="50"
    stroke-dasharray="188 440"
    stroke-dashoffset="-118"
    stroke-linecap="butt"/>

  <circle cx="150" cy="150" r="100" fill="none"
    stroke="#F5A623"
    stroke-width="50"
    stroke-dasharray="157 471"
    stroke-dashoffset="-308"
    stroke-linecap="butt"/>

  <circle cx="150" cy="150" r="63" fill="white"/>

  <text x="150" y="163"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="48"
    font-weight="500"
    fill="#1A1A1A"
    text-anchor="middle">$</text>
</svg>
