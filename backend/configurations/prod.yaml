info:
    name: "Expenses Counter"
    description: "The application for counting expenses"
    api_info:
        app_port: 3000
        debug: false
        log_level: INFO
    cors_info:
        origins: "*"
        allow_credentials: true
        allow_methods:
            - GET
            - POST
            - PUT
            - DELETE
        allow_headers:
            - "*"

services:
    database:
        provider: "sqlite+aiosqlite"
        host: expenses.sqlite3