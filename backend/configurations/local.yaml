info:
    name: "Expenses Counter"
    description: "The application for counting expenses"
    api_info:
        app_port: 8000
        debug: true
        log_level: DEBUG
    cors_info:
        origins: "*"
        allow_credentials: true
        allow_methods:
            - GET
            - POST
            - PUT
            - DELETE
        allow_headers:
            - "*"

services:
    database:
        provider: "postgresql+asyncpg"
        name: expenses_counter
        host: localhost
        port: 5432
        password: root
        user: root