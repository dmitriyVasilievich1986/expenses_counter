services:
  nginx:
    image: nginx:latest
    container_name: expenses-nginx
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/config/nginx.conf:/etc/nginx/nginx.conf
      - ./backend/static:/usr/share/nginx/html/static
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend

  db:
    image: postgres:18
    container_name: expenses-db
    env_file:
      - path: ./backend/db.env
        required: true
    ports:
      - 5432:5432
    volumes:
      - ./db/data:/var/lib/postgresql

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: expenses-backend
    image: expenses:latest
    env_file:
      - path: ./backend/.env
        required: true
      - path: ./backend/db.env
        required: false
    environment:
      - CONFIG_FILE_PATH=/opt/backend/configurations/local.yaml
    command: uvicorn src.expenses_counter.modules.app:get_app --host 0.0.0.0
      --reload --port 8000
    ports:
      - 8000:8000
    volumes:
      - ./backend/configurations:/opt/backend/configurations
      - ./backend/src:/opt/backend/src
      - ./backend/static:/opt/backend/static
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: node:24
    container_name: expenses-frontend
    profiles:
      - frontend
    environment:
      - VITE_API_HOST=
      - VITE_IMAGES_HOST=/static/i
    volumes:
      - ./backend/static:/opt/backend/static
      - ./frontend/src:/opt/frontend/src
      - ./frontend/package.json:/opt/frontend/package.json
      - ./frontend/scripts:/opt/frontend/scripts
      - ./frontend/tsconfig.app.json:/opt/frontend/tsconfig.app.json
      - ./frontend/tsconfig.json:/opt/frontend/tsconfig.json
      - ./frontend/tsconfig.node.json:/opt/frontend/tsconfig.node.json
      - ./frontend/vite.config.ts:/opt/frontend/vite.config.ts
      - ./frontend/index.html:/opt/frontend/index.html
    working_dir: /opt/frontend
    command: [ "/bin/bash", "scripts/start.sh" ]
    depends_on:
      - backend
